name: Sync v0.5.3 lockfile

on:
  push:
    branches: [hotfix-v0.5.3-windows-input]
    paths:
      - Cargo.toml
      - .github/workflows/sync-v053-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-v0.5.3-windows-input
      - uses: dtolnay/rust-toolchain@stable
      - name: Update lockfile
        run: cargo check
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Sync Cargo.lock for v0.5.3"
          git push origin HEAD:hotfix-v0.5.3-windows-input
