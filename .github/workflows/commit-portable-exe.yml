name: Commit portable Scriblet EXE

on:
  push:
    branches: [release/scriblet-exe]

permissions:
  contents: write

jobs:
  build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/scriblet-exe
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Regression and UAT tests
        run: cargo test --all-targets --target x86_64-pc-windows-msvc
      - name: Build portable Scriblet.exe
        run: cargo build --release --target x86_64-pc-windows-msvc --bin scriblet
      - name: Stage executable in repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force releases/v0.1.0 | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/scriblet.exe releases/v0.1.0/Scriblet.exe
          $size = (Get-Item releases/v0.1.0/Scriblet.exe).Length
          if ($size -lt 100000) { throw "Scriblet.exe is unexpectedly small: $size bytes" }
      - name: Commit executable to PR branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/v0.1.0/Scriblet.exe
          git commit -m "release: add portable Scriblet v0.1.0 executable"
          git push origin HEAD:release/scriblet-exe
