name: Publish Scriblet v0.1.0

on:
  push:
    branches: [rust-mvp]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Regression and UAT tests
        run: cargo test --all-targets --target x86_64-pc-windows-msvc
      - name: Build Scriblet.exe
        run: cargo build --release --target x86_64-pc-windows-msvc --bin scriblet
      - name: Stage binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/scriblet.exe dist/Scriblet.exe
      - name: Publish v0.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: rust-mvp
          name: Scriblet v0.1.0
          generate_release_notes: true
          files: dist/Scriblet.exe
