name: Windows portable build

on:
  push:
    branches: [main, rust-mvp]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Regression and UAT tests
        run: cargo test --all-targets --target x86_64-pc-windows-msvc
      - name: Build portable release EXE
        run: cargo build --release --target x86_64-pc-windows-msvc --bin scriblet
      - name: Stage portable binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/scriblet.exe dist/Scriblet.exe
      - name: Smoke check portable EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Scriblet.exe)) { throw "Scriblet.exe was not produced" }
          $size = (Get-Item dist/Scriblet.exe).Length
          if ($size -lt 100000) { throw "Scriblet.exe is unexpectedly small: $size bytes" }
          Write-Host "Portable Scriblet.exe built successfully: $size bytes"
      - name: Upload portable Scriblet artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scriblet-Windows-Portable
          path: dist/Scriblet.exe
          if-no-files-found: error
      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Scriblet.exe
          generate_release_notes: true
