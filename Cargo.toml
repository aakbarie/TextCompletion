[package]
name = "textcompletion"
version = "0.4.1"
edition = "2021"
build = "build.rs"

[[bin]]
name = "scriblet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
directories = "6"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
slint = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = "0.6.1"
rdev = { version = "0.5.3", features = ["unstable_grab"] }

[target.'cfg(target_os = "windows")'.dependencies]
odbc-api = { version = "29", default-features = false }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
panic = "abort"
strip = "symbols"
