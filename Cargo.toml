[package]
name = "textcompletion"
version = "0.5.4"
edition = "2021"
build = "build.rs"
description = "Scriblet: local-first text expansion for Windows and macOS"

[[bin]]
name = "scriblet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
log = "0.4"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
slint = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }
tray-icon = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
enigo = "0.6.1"
foreign-types = "0.5"
macos-accessibility-client = "0.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
odbc-api = { version = "29", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
panic = "abort"
strip = "symbols"
